<form class="collapse mt-3" id="contactForm">
  <div class="form-floating mb-3">
    <input type="text" class="form-control" id="name" placeholder="Name">
    <label for="name">Ime*</label>
  </div>
  <div class="form-floating mb-3">
    <input type="text" class="form-control" id="surname" placeholder="Surname">
    <label for="surname">Prezime*</label>
  </div>
  <div class="form-floating mb-3">
    <input type="email" class="form-control" id="email" placeholder="Email">
    <label for="email">Email*</label>
  </div>
  <div class="form-floating mb-3">
    <input type="tel" class="form-control" id="phoneNumber" placeholder="PhoneNumber">
    <label for="phoneNumber">Broj telefona*</label>
  </div>
  <div class="form-floating mb-3">
    <select class="form-select" id="course" aria-label="Odabrani tečaj" disabled>
      <option selected>Početni tečaj standardnih, latinskoameričkih i društvenih plesova</option>
    </select>
    <label for="course">Odabrani tečaj</label>
  </div>
  <div class="form-floating mb-3">
    <textarea class="form-control" placeholder="Napomene" id="remarks"></textarea>
    <label for="remarks">Napomene</label>
  </div>
  <button type="submit" class="btn btn-gold">Pošalji</button>
</form>
