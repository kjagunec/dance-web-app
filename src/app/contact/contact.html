<div class="container mt-5">
  <section class="row">
    <div class="col-lg-5 col-12">
      <h2 class="title-gold">Kontakt</h2>
      <p><b>BANDERILLAS</b>, obrt za zabavne djelatnosti, Vl. Senad Pekić
        Sjedište: Ulica Petra i Tome Erdoedyja 16, 10000 Zagreb</p>
      <p>Slobodno nas kontaktirajte na društvenim mrežama, telefonom ili e-mailom. Odgovoriti ćemo vam u najkraćem mogućem roku.</p>
    </div>
    <div class="col-lg-7 col-12">
      <form class="mt-3 border border-secondary-subtle rounded p-4">
        <h5 class="mb-3">Javite nam se!</h5>
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="name" placeholder="Name">
          <label for="name">Ime*</label>
        </div>
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="surname" placeholder="Surname">
          <label for="surname">Prezime*</label>
        </div>
        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="email" placeholder="Email">
          <label for="email">Email*</label>
        </div>
        <div class="form-floating mb-3">
          <input type="tel" class="form-control" id="phoneNumber" placeholder="PhoneNumber">
          <label for="phoneNumber">Broj telefona*</label>
        </div>
        <div class="form-floating mb-3">
          <textarea class="form-control" placeholder="Upit" id="query" style="height: 10rem"></textarea>
          <label for="query">Upit</label>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" value="" id="informationCheck">
          <label class="form-check-label" for="informationCheck">
            Slažem se sa upotrebom osobnih podataka*
          </label>
        </div>
        <button type="submit" class="btn btn-gold">Pošalji</button>
      </form>
    </div>
  </section>
</div>
